<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <meta name="description" content="我的记账本儿：GPT 记账，Notion 保存，分层筛选与同期分析。" />
  <title>我的记账本儿</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css?v=2" />
  <script src="./analytics.js?v=2" defer></script>
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">¥</span><span>我的记账本儿</span></div>
      <button class="icon-button top-action" id="topAction" aria-label="设置"></button>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-tab="home" aria-label="首页"><span class="nav-icon" data-icon="house"></span><span>首页</span></button>
      <button class="nav-item" data-tab="records" aria-label="明细"><span class="nav-icon" data-icon="list"></span><span>明细</span></button>

      <button class="nav-item" data-tab="stats" aria-label="统计"><span class="nav-icon" data-icon="chart"></span><span>统计</span></button>
      <button class="nav-item" data-tab="settings" aria-label="我的"><span class="nav-icon" data-icon="settings"></span><span>我的</span></button>
    </nav>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop" role="presentation">
    <section class="sheet" id="entrySheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2 id="sheetTitle">账单详情</h2><button class="icon-button" id="closeSheet" aria-label="关闭"></button></div>
      <div id="entryDetails"></div>
    </section>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
  <input type="file" accept=".json,.csv,application/json,text/csv" id="importFile" hidden />
</body>
</html>
