<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <meta name="description" content="我的记账本儿：简单记收支，看清每一笔。" />
  <title>我的记账本儿</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">¥</span><span>我的记账本儿</span></div>
      <button class="icon-button top-action" id="topAction" aria-label="设置"></button>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-tab="home" aria-label="首页"><span class="nav-icon" data-icon="house"></span><span>首页</span></button>
      <button class="nav-item" data-tab="records" aria-label="明细"><span class="nav-icon" data-icon="list"></span><span>明细</span></button>
      <button class="add-fab" id="addFab" aria-label="记一笔"><span data-icon="plus"></span></button>
      <button class="nav-item" data-tab="stats" aria-label="统计"><span class="nav-icon" data-icon="chart"></span><span>统计</span></button>
      <button class="nav-item" data-tab="settings" aria-label="我的"><span class="nav-icon" data-icon="settings"></span><span>我的</span></button>
    </nav>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop" role="presentation">
    <section class="sheet" id="entrySheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2 id="sheetTitle">记一笔</h2><button class="icon-button" id="closeSheet" aria-label="关闭"></button></div>
      <form id="entryForm">
        <input type="hidden" id="entryId" />
        <div class="type-segments" id="entryTypeGroup"><button type="button" class="selected expense" data-type="支出">支出</button><button type="button" data-type="收入">收入</button></div>
        <label class="amount-block"><span>金额（元）</span><span class="amount-input-row"><b>¥</b><input id="entryAmount" inputmode="decimal" type="number" min="0.01" step="0.01" max="100000000" placeholder="0.00" required autocomplete="off" /></span></label>
        <div class="form-grid">
          <label class="form-field full"><span>项目名称 *</span><input id="entryName" maxlength="100" placeholder="例如：午餐、工资、话费充值" required /></label>
          <label class="form-field full"><span>分类</span><select id="entryPreset"></select></label>
          <div class="custom-classification hidden full" id="customClassification">
            <label class="form-field"><span>一级分类</span><input id="entryCat1" maxlength="40" placeholder="例如：日常生活" /></label>
            <label class="form-field"><span>二级分类</span><input id="entryCat2" maxlength="40" placeholder="例如：通讯费用" /></label>
            <label class="form-field full"><span>三级分类</span><input id="entryCat3" maxlength="40" placeholder="例如：手机话费" /></label>
          </div>
          <label class="form-field"><span>日期 *</span><input id="entryDate" type="date" required /></label>
          <label class="form-field"><span>时间</span><input id="entryTime" type="time" /></label>
          <label class="form-field full"><span>商家 / 对象</span><input id="entryMerchant" maxlength="100" placeholder="可不填" /></label>
          <label class="form-field full"><span>备注</span><textarea id="entryNote" rows="2" maxlength="500" placeholder="可不填"></textarea></label>
        </div>
        <div class="form-actions"><button type="button" class="delete-button hidden" id="deleteEntry">删除记录</button><button type="submit" class="primary-button" id="saveEntry">保存这笔账</button></div>
      </form>
    </section>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
  <input type="file" accept=".json,.csv,application/json,text/csv" id="importFile" hidden />
</body>
</html>
